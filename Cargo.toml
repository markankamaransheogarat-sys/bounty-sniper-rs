[package]
name = "bounty-sniper-rs"
version = "0.1.0"
edition = "2021"
authors = ["markankamaransheogarat-sys"]
description = "High-Frequency GitHub Bounty Scanner & Verification Radar in Rust with Telegram Alerts"
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
